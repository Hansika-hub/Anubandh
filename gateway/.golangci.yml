# Lint config for gateway/ (M2). CI: golangci-lint run ./...  (golangci-lint v2.15, Go 1.26)
version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - gosec
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - unconvert
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - prealloc
    - revive
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
