# Serves the built SPA on :3000 and proxies every backend under the same origin, so the browser
# needs no CORS and EventSource works. Upstreams are resolved per request (Docker DNS), so the web
# container starts even when an optional service (forecast, simulators) is not running.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway  http://gateway:8080;
  set $forecast http://forecast:8090;
  set $sim_grn  http://sim-grn:8102;
  set $sim_gst  http://sim-gst:8103;
  set $sim_udyam http://sim-udyam:8104;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Request-Id $request_id;

  # Server-Sent Events: no buffering, long reads.
  location = /api/v1/events/stream {
    proxy_pass $gateway;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /api/        { proxy_pass $gateway; }
  location /forecast/   { proxy_pass $forecast; proxy_read_timeout 120s; }
  location /sim/grn/    { proxy_pass $sim_grn; }
  location /sim/qc/     { proxy_pass $sim_grn; }
  location /sim/invoice/ { proxy_pass $sim_gst; }
  location /udyam/      { proxy_pass $sim_udyam; }
  # /internal/* (gateway service API) is deliberately not proxied.

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
